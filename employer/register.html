<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Employer Registration | SK Job BD</title>

    <link rel="stylesheet"
        href="register.css">

    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="page">

<header class="topHeader">

<div class="logoArea">

<h1>SK Job BD</h1>

<p>

Employer / Educational Institution Registration

</p>

</div>

</header>

<section class="registerSection">

<div class="registerCard">

<div class="titleArea">

<h2>

<i class="fa-solid fa-building"></i>

Employer Registration

</h2>

<p>

শুধুমাত্র প্রতিষ্ঠান, কোম্পানি, এনজিও ও শিক্ষা প্রতিষ্ঠান নিবন্ধন করতে পারবে।

</p>

</div>

<form id="registerForm">

<div class="row">

<div class="inputBox">

<label>

Account Type *

</label>

<select id="accountType">

<option value="">

Select Account Type

</option>

<option>

Company

</option>

<option>

NGO

</option>

<option>

School

</option>

<option>

College

</option>

<option>

Madrasa

</option>

<option>

University

</option>

<option>

Hospital

</option>

<option>

Coaching Center

</option>

<option>

Government Office

</option>

<option>

Others

</option>

</select>

</div>

<div class="inputBox">

<label>

Organization Name *

</label>

<input

type="text"

id="organization"

placeholder="Organization Name">

</div>

</div>

<div class="row">

<div class="inputBox">

<label>

Contact Person *

</label>

<input

type="text"

id="contactPerson"

placeholder="Contact Person">

</div>

<div class="inputBox">

<label>

Mobile Number *

</label>

<input

type="text"

id="mobile"

placeholder="01XXXXXXXXX">

</div>

</div>

<div class="row">

<div class="inputBox">

<label>

Email Address *

</label>

<input

type="email"

id="email"

placeholder="example@email.com">

</div>

<div class="inputBox">

<label>

Institution / Company Address *

</label>

<input

type="text"

id="address"

placeholder="Address">

</div>

</div>

  <div class="row">

<div class="inputBox">

<label>

Trade License No. (Optional)

</label>

<input
type="text"
id="tradeLicense"
placeholder="Trade License Number">

</div>

<div class="inputBox">

<label>

EIIN Code (School / College Only)

</label>

<input
type="text"
id="eiin"
placeholder="EIIN Code">

</div>

</div>

<div class="row">

<div class="inputBox">

<label>

Password *

</label>

<input
type="password"
id="password"
placeholder="Password">

</div>

<div class="inputBox">

<label>

Confirm Password *

</label>

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password">

</div>

</div>

<div class="checkboxArea">

<label>

<input
type="checkbox"
id="agree"
required>

আমি নিশ্চিত করছি যে প্রদানকৃত সকল তথ্য সঠিক এবং SK Job BD-এর নীতিমালা মেনে চলবো।

</label>

</div>

<div id="message" class="messageBox"></div>

<button
type="submit"
class="registerBtn">

<i class="fa-solid fa-user-plus"></i>

Register Now

</button>

<div class="loginArea">

<p>

আগেই Account আছে?

</p>

<a href="login.html">

Employer Login

</a>

</div>

</form>

</div>

</section>

<footer>

<p>

Powered by

<strong>

SK Job BD

</strong>

</p>

</footer>

</div>

<script type="module"
src="register.js"></script>

</body>

</html>
