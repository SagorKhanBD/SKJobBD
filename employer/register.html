<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

SK Job BD Company Registration

</title>

<link
rel="stylesheet"
href="register.css">

</head>

<body>

<header>

<div class="header-container">

<h1>

🏢 SK Job BD

</h1>

<p>

Company Registration

</p>

</div>

</header>

<div class="container">

<h2>

কোম্পানির নতুন একাউন্ট তৈরি করুন

</h2>

<p class="subtitle">

যেসব তথ্যের পাশে
<span class="required">*</span>
আছে সেগুলো পূরণ করা বাধ্যতামূলক।

</p>

<form id="registerForm">

<!-- =========================
Company Name
========================= -->

<div class="form-group">

<label>

প্রতিষ্ঠানের নাম

<span class="required">*</span>

</label>

<input
type="text"
id="companyName"
placeholder="প্রতিষ্ঠানের নাম লিখুন"
required>

</div>

<!-- =========================
Institution Code
========================= -->

<div class="form-group">

<label>

প্রতিষ্ঠানের কোড (যদি থাকে)

</label>

<input
type="text"
id="institutionCode"
placeholder="যদি থাকে লিখুন">

</div>

<!-- =========================
Owner Name
========================= -->

<div class="form-group">

<label>

কর্তৃপক্ষের নাম

<span class="required">*</span>

</label>

<input
type="text"
id="ownerName"
placeholder="আপনার নাম লিখুন"
required>

</div>

<!-- =========================
Mobile Number
========================= -->

<div class="form-group">

<label>

মোবাইল নম্বর

<span class="required">*</span>

</label>

<input
type="tel"
id="mobile"
placeholder="01XXXXXXXXX"
required>

</div>

    <!-- =========================
Email
========================= -->

<div class="form-group">

<label>

Gmail (Optional)

</label>

<input
type="email"
id="email"
placeholder="example@gmail.com">

</div>

<!-- =========================
Company Logo
========================= -->

<div class="form-group">

<label>

কোম্পানির লোগো (Optional)

</label>

<input
type="file"
id="companyLogo"
accept="image/*">

</div>

<!-- =========================
Password
========================= -->

<div class="form-group">

<label>

Password

<span class="required">*</span>

</label>

<input
type="password"
id="password"
placeholder="কমপক্ষে ৮ অক্ষর"
required>

</div>

<!-- =========================
Confirm Password
========================= -->

<div class="form-group">

<label>

Confirm Password

<span class="required">*</span>

</label>

<input
type="password"
id="confirmPassword"
placeholder="পুনরায় Password লিখুন"
required>

</div>

<!-- =========================
Register Button
========================= -->

<button
type="submit"
class="register-btn">

🏢 কোম্পানির একাউন্ট তৈরি করুন

</button>

<p id="message"></p>

<div class="login-link">

আগে থেকেই একাউন্ট আছে?

<a href="login.html">

Company Login

</a>

</div>

    </form>

</div>

<footer>

<p>

© 2026 SK Job BD

</p>

<p>

Company Registration System

</p>

</footer>

<script
type="module"
src="register.js">

</script>

</body>

</html>
