<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>SK Job BD Company Registration</title>

    <link
        rel="stylesheet"
        href="register.css">

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header class="topHeader">

        <div class="logoArea">

            <h1>
                🏢 SK Job BD
            </h1>

            <p>
                Company Registration
            </p>

        </div>

    </header>



    <!-- =========================
         MAIN
    ========================== -->

    <main class="container">


        <div class="registerCard">


            <!-- =========================
                 TITLE
            ========================== -->

            <div class="titleArea">

                <h2>
                    কোম্পানির নতুন একাউন্ট তৈরি করুন
                </h2>

                <p>
                    যেসব তথ্যের পাশে
                    <strong>*</strong>
                    আছে সেগুলো পূরণ করা বাধ্যতামূলক।
                </p>

            </div>



            <!-- =========================
                 MESSAGE
            ========================== -->

            <div
                id="message"
                class="messageBox">
            </div>



            <!-- =========================
                 REGISTRATION FORM
            ========================== -->

            <form
                id="registerForm"
                autocomplete="off">


                <!-- =========================
                     COMPANY NAME
                ========================== -->

                <div class="inputBox">

                    <label for="companyName">

                        প্রতিষ্ঠানের নাম
                        <span>*</span>

                    </label>

                    <input
                        type="text"
                        id="companyName"
                        name="companyName"
                        placeholder="আপনার প্রতিষ্ঠানের নাম লিখুন"
                        required>

                </div>



                <!-- =========================
                     INSTITUTION CODE
                     OPTIONAL
                ========================== -->

                <div class="inputBox">

                    <label for="institutionCode">

                        প্রতিষ্ঠানের কোড
                        <small>(যদি থাকে)</small>

                    </label>

                    <input
                        type="text"
                        id="institutionCode"
                        name="institutionCode"
                        placeholder="যদি থাকে লিখুন">

                </div>



                <!-- =========================
                     OWNER NAME
                ========================== -->

                <div class="inputBox">

                    <label for="ownerName">

                        কর্তৃপক্ষের নাম
                        <span>*</span>

                    </label>

                    <input
                        type="text"
                        id="ownerName"
                        name="ownerName"
                        placeholder="কর্তৃপক্ষের নাম লিখুন"
                        required>

                </div>



                <!-- =========================
                     MOBILE
                ========================== -->

                <div class="inputBox">

                    <label for="mobile">

                        মোবাইল নম্বর
                        <span>*</span>

                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        name="mobile"
                        placeholder="01XXXXXXXXX"
                        maxlength="11"
                        inputmode="numeric"
                        autocomplete="tel"
                        required>

                </div>



                <!-- =========================
                     EMAIL
                     OPTIONAL
                ========================== -->

                <div class="inputBox">

                    <label for="email">

                        Gmail
                        <small>(Optional)</small>

                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@gmail.com"
                        autocomplete="email">

                </div>



                <!-- =========================
                     COMPANY LOGO
                     OPTIONAL
                ========================== -->

                <div class="inputBox">

                    <label for="companyLogo">

                        কোম্পানির লোগো
                        <small>(Optional)</small>

                    </label>

                    <input
                        type="file"
                        id="companyLogo"
                        name="companyLogo"
                        accept="image/png,image/jpeg,image/jpg,image/webp">

                </div>



                <!-- =========================
                     PASSWORD
                ========================== -->

                <div class="inputBox">

                    <label for="password">

                        Password
                        <span>*</span>

                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="কমপক্ষে ৮ অক্ষরের Password"
                        minlength="8"
                        autocomplete="new-password"
                        required>

                    <small class="securityText">

                        High Security Password ব্যবহার করুন:
                        বড় হাতের অক্ষর, ছোট হাতের অক্ষর,
                        সংখ্যা ও বিশেষ চিহ্ন।

                    </small>

                </div>



                <!-- =========================
                     CONFIRM PASSWORD
                ========================== -->

                <div class="inputBox">

                    <label for="confirmPassword">

                        Confirm Password
                        <span>*</span>

                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Password আবার লিখুন"
                        minlength="8"
                        autocomplete="new-password"
                        required>

                </div>



                <!-- =========================
                     SUBMIT BUTTON
                ========================== -->

                <button
                    type="submit"
                    class="registerBtn">

                    🏢 কোম্পানির একাউন্ট তৈরি করুন

                </button>


            </form>



            <!-- =========================
                 LOGIN LINK
            ========================== -->

            <div class="loginArea">

                <p>
                    আগে থেকেই একাউন্ট আছে?
                </p>

                <a
                    href="login.html">

                    Company Login

                </a>

            </div>


        </div>


    </main>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            © 2026 SK Job BD
        </p>

        <small>
            Company Registration System
        </small>

    </footer>



    <!-- =========================
         REGISTER JS
    ========================== -->

    <script
        type="module"
        src="register.js">
    </script>


</body>

</html>
