<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employer Login | SK Job BD</title>

    <!-- Login CSS -->
    <link rel="stylesheet" href="login.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

</head>


<body>


    <!-- ================= HEADER ================= -->

    <header class="topHeader">

        <div class="logoArea">

            <h1>SK Job BD</h1>

            <p>Employer / Institution Login Panel</p>

        </div>

    </header>



    <!-- ================= LOGIN CARD ================= -->

    <main class="container">

        <div class="loginCard">


            <!-- ================= TITLE ================= -->

            <div class="titleArea">

                <h2>Employer Login</h2>

                <p>
                    শুধুমাত্র নিবন্ধিত প্রতিষ্ঠান বা কোম্পানির জন্য।
                </p>

            </div>



            <!-- ================= LOGIN FORM ================= -->

            <form id="loginForm">


                <!-- ================= MOBILE ================= -->

                <div class="inputBox">

                    <label for="mobile">
                        মোবাইল নম্বর
                    </label>

                    <input
                        type="text"
                        id="mobile"
                        name="mobile"
                        placeholder="01XXXXXXXXX"
                        maxlength="11"
                        inputmode="numeric"
                        autocomplete="tel"
                        required>

                </div>



                <!-- ================= PASSWORD ================= -->

                <div class="inputBox">

                    <label for="password">
                        Password
                    </label>


                    <div class="passwordBox">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Password"
                            minlength="8"
                            autocomplete="current-password"
                            required>


                        <!-- Password Show / Hide -->

                        <button
                            type="button"
                            id="togglePassword"
                            class="eyeIcon"
                            aria-label="Show Password"
                            title="Show Password">

                            👁

                        </button>

                    </div>

                </div>



                <!-- ================= MESSAGE ================= -->

                <div
                    id="message"
                    class="messageBox">
                </div>



                <!-- ================= REMEMBER ME ================= -->

                <div class="rememberArea">

                    <label for="rememberMe">

                        <input
                            type="checkbox"
                            id="rememberMe"
                            name="rememberMe">

                        আমাকে মনে রাখুন

                    </label>

                </div>



                <!-- ================= LOGIN BUTTON ================= -->

                <button
                    type="submit"
                    class="loginBtn">

                    Login

                </button>


            </form>



            <!-- ================= FORGOT PASSWORD ================= -->

            <div class="linkArea">

                <a href="forgot-password.html">

                    Forgot Password?

                </a>

            </div>



            <!-- ================= REGISTRATION ================= -->

            <div class="registerArea">

                <p>

                    নতুন প্রতিষ্ঠান / কোম্পানি?

                </p>


                <a
                    href="register.html"
                    class="registerBtn">

                    Register Now

                </a>

            </div>



            <!-- ================= HOME ================= -->

            <div class="homeArea">

                <a
                    href="../index.html"
                    class="homeBtn">

                    ← Back to Home

                </a>

            </div>


        </div>

    </main>



    <!-- ================= FOOTER ================= -->

    <footer>

        <p>

            © 2026 SK Job BD | Employer Portal

        </p>


        <small>

            Powered by <strong>SK Job BD</strong>

        </small>

    </footer>



    <!-- ================= LOGIN SCRIPT ================= -->

    <script
        type="module"
        src="login.js">
    </script>


</body>

</html>
