<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employer Login | SK Job BD</title>

    <link rel="stylesheet" href="login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="topHeader">

        <div class="logoArea">

            <h1>SK Job BD</h1>

            <p>Employer / Institution Login Panel</p>

        </div>

    </header>

    <!-- ================= LOGIN CARD ================= -->

    <main class="container">

        <div class="loginCard">

            <div class="titleArea">

                <h2>Employer Login</h2>

                <p>
                    শুধুমাত্র নিবন্ধিত প্রতিষ্ঠান বা কোম্পানির জন্য।
                </p>

            </div>

            <form id="loginForm">

                <!-- Mobile -->

                <div class="inputBox">

                    <label>মোবাইল নম্বর</label>

                    <input
                        type="text"
                        id="mobile"
                        placeholder="01XXXXXXXXX"
                        maxlength="11"
                        required>

                </div>

                <!-- Password -->

                <div class="inputBox">

                    <label>Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required>

                </div>

                <div id="message" class="messageBox"></div>

                                <!-- Remember Me -->

                <div class="rememberArea">

                    <label>

                        <input type="checkbox" id="rememberMe">

                        আমাকে মনে রাখুন

                    </label>

                </div>

                <!-- Login Button -->

                <button
                    type="submit"
                    class="loginBtn">

                    Login

                </button>

            </form>

            <!-- Links -->

            <div class="linkArea">

                <a href="forgot-password.html">

                    Forgot Password?

                </a>

            </div>

            <div class="registerArea">

                <p>

                    নতুন প্রতিষ্ঠান / কোম্পানি?

                </p>

                <a
                    href="register.html"
                    class="registerBtn">

                    Register Now

                </a>

            </div>

            <div class="homeArea">

                <a
                    href="../index.html"
                    class="homeBtn">

                    ← Back to Home

                </a>

            </div>

        </div>

    </main>

        <!-- ================= FOOTER ================= -->

    <footer>

        <p>

            © 2026 SK Job BD | Employer Portal

        </p>

        <small>

            Powered by <strong>SK Job BD</strong>

        </small>

    </footer>

    <!-- Login Script -->

    <script type="module" src="login.js"></script>

</body>

</html>
