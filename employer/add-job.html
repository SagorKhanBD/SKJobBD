<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Post New Job | SK Job BD</title>

    <link rel="stylesheet" href="add-job.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<header class="topHeader">

    <h1>SK Job BD</h1>

    <p>Employer Job Posting Panel</p>

</header>

<main class="container">

    <div class="card">

        <h2>নতুন চাকরির বিজ্ঞপ্তি প্রকাশ করুন</h2>

        <form id="jobForm">

            <!-- Job Title -->

            <div class="inputBox">

                <label>চাকরির শিরোনাম *</label>

                <input
                    type="text"
                    id="jobTitle"
                    required
                >

            </div>

            <!-- Organization -->

            <div class="inputBox">

                <label>প্রতিষ্ঠানের নাম *</label>

                <input
                    type="text"
                    id="companyName"
                    required
                >

            </div>

            <!-- Job Category -->

            <div class="inputBox">

                <label>চাকরির বিভাগ *</label>

                <select id="jobCategory">

                    <option value="">নির্বাচন করুন</option>

                    <option>সরকারি চাকরি</option>

                    <option>এনজিও চাকরি</option>

                    <option>ব্যাংক চাকরি</option>

                    <option>প্রাইভেট কোম্পানি</option>

                    <option>স্কুল</option>

                    <option>কলেজ</option>

                    <option>মাদ্রাসা</option>

                    <option>হাসপাতাল</option>

                </select>

            </div>

            <!-- Job Location -->

            <div class="inputBox">

                <label>কর্মস্থল *</label>

                <input
                    type="text"
                    id="jobLocation"
                >

            </div>

                      <!-- Deadline -->

            <div class="inputBox">

                <label>আবেদনের শেষ তারিখ *</label>

                <input
                    type="date"
                    id="deadline"
                    required
                >

            </div>

            <!-- Education -->

            <div class="inputBox">

                <label>শিক্ষাগত যোগ্যতা *</label>

                <input
                    type="text"
                    id="education"
                    placeholder="যেমন: স্নাতক / এইচএসসি / এসএসসি"
                >

            </div>

            <!-- Salary -->

            <div class="inputBox">

                <label>বেতন</label>

                <input
                    type="text"
                    id="salary"
                    placeholder="আলোচনা সাপেক্ষে / ২৫,০০০ টাকা"
                >

            </div>

            <!-- Vacancy -->

            <div class="inputBox">

                <label>পদের সংখ্যা</label>

                <input
                    type="number"
                    id="vacancy"
                    min="1"
                    placeholder="যেমন: ৫"
                >

            </div>

            <!-- Job Description -->

            <div class="inputBox">

                <label>চাকরির বিস্তারিত *</label>

                <textarea
                    id="jobDescription"
                    rows="8"
                    placeholder="চাকরির দায়িত্ব, অভিজ্ঞতা, শর্তাবলী ইত্যাদি লিখুন..."
                    required
                ></textarea>

            </div>

            <!-- Apply Method -->

            <div class="inputBox">

                <label>আবেদনের লিংক / ইমেইল</label>

                <input
                    type="text"
                    id="applyLink"
                    placeholder="https:// অথবা ইমেইল ঠিকানা"
                >

            </div>

            <!-- Submit -->

            <div class="inputBox">

                <button
                    type="submit"
                    id="submitJobBtn"
                >

                    📤 চাকরির বিজ্ঞপ্তি জমা দিন

                </button>

            </div>

            <div id="message"></div>

        </form>

    </div>

      <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <p>
            © 2026 SK Job BD | Employer Job Portal
        </p>

        <small>
            Powered by <strong>SK Job BD</strong>
        </small>

    </footer>

    <!-- ================= JAVASCRIPT ================= -->

    <script type="module" src="add-job.js"></script>

</body>

</html>
